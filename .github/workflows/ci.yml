name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything the repository requires to merge, on the toolchain go.mod pins.
  # The build, vet, test, index-script and race stages live in go-tests.yml, so
  # the advisory run below executes the same steps instead of a copy of them.
  go:
    uses: ./.github/workflows/go-tests.yml

  # The same stages on the latest Go release. A newer toolchain can break the
  # suite without any change to this repository: Go 1.27's compress/flate
  # started emitting a stored block for a 60-byte input, which made
  # TestDecodeEvidenceBodyGzipQuoteFound fail on its own "fixture is not
  # compressed" guard (#276). This job runs the same workflow on the latest
  # release so that drift shows up here rather than in a contributor's lap.
  #
  # Advisory on purpose: a new toolchain release is not a change to this
  # repository, and it must not block an unrelated merge the day it lands. A job
  # that calls a reusable workflow cannot set continue-on-error itself, so the
  # caller passes advisory: true and each step there reports without failing the
  # job. Once the pinned floor is raised, drop the input and this becomes a
  # required check.
  go-stable:
    uses: ./.github/workflows/go-tests.yml
    with:
      go-version: stable
      advisory: true

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The official action uses the Go version declared by go.mod and reports
      # only vulnerabilities reachable from this module's packages.
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on the ubuntu runners. -S warning: the scripts
      # currently have only info-level notes (intentional A && B || C chains in
      # update.sh, an unquoted glob in backup.sh's prune), so fail on warnings.
      - run: shellcheck -S warning install.sh update.sh start.sh scripts/backup.sh scripts/verify.sh reset-password.sh scripts/extract-changelog-section.sh scripts/test-extract-changelog-section.sh .github/scripts/bot.sh scripts/test-bot-context.sh
      - run: bash scripts/test-extract-changelog-section.sh
      # The triage bot's repository summary must expose every top-level
      # directory; a truncated file list once made it deny that docs/ and
      # scripts/benchmark/ exist.
      - run: bash scripts/test-bot-context.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:polling
      - run: npm run test:replay
      - run: npm run test:upload
      - run: npm run test:traffic-stream
      - run: npm run test:i18n
      - run: npm run test:bash
      - run: npm run build:static

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/posture_check_test.py
      - run: python3 -m unittest discover -s scripts/benchmark -p 'test_*.py' -v

  # Mutation checks: break a boundary on purpose and require the test that guards
  # it to fail. A green result after the mutation means the assertion was
  # decorative — the exact failure a passing suite cannot show you. The script
  # edits tracked files and restores them with `git checkout --`, so it refuses to
  # start unless those files are clean.
  mutation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: artextest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:testpass@localhost:5432/artextest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: mutations
        run: python3 scripts/mutation_check.py
